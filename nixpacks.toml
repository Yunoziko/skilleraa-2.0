# Repo-root Railway build: Python API only (ignore frontend Node app).
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

# Nixpacks provides `python`, not a global `pip` on PATH — use `python -m pip`.
[phases.install]
cmds = ["python -m pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && python -m uvicorn server:app --host 0.0.0.0 --port $PORT"
